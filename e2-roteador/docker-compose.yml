name: e2

x-host: &host
  image: redes-lab-base:1
  cap_add: [NET_ADMIN]
  command: ["sh","-c","ip route del default 2>/dev/null || true; exec sleep infinity"]

services:
  host-a1:
    <<: *host
    container_name: e2-host-a1
    command:
      - sh
      - -c
      - |
        ip route del default 2>/dev/null || true
        ip route add 10.0.20.0/24 via 10.0.10.254
        exec sleep infinity
    networks: {seg-a: {ipv4_address: 10.0.10.10}}

  host-a2:
    <<: *host
    container_name: e2-host-a2
    networks: {seg-a: {ipv4_address: 10.0.10.11}}
    # Grupo de controle: SEM rota de propósito. Não mexer.

  srv-a:
    image: redes-lab-base:1
    container_name: e2-srv-a
    cap_add: [NET_ADMIN]
    command:
      - sh
      - -c
      - |
        ip route del default 2>/dev/null || true
        echo "servidor srv-a, segmento A, 10.0.10.20" > /srv/index.html
        exec httpd -f -p 8080 -h /srv
    networks: {seg-a: {ipv4_address: 10.0.10.20}}

  host-b1:
    <<: *host
    container_name: e2-host-b1
    command:
      - sh
      - -c
      - |
        ip route del default 2>/dev/null || true
        ip route add 10.0.10.0/24 via 10.0.20.254
        exec sleep infinity
    networks: {seg-b: {ipv4_address: 10.0.20.10}}

  host-b2:
    <<: *host
    container_name: e2-host-b2
    networks: {seg-b: {ipv4_address: 10.0.20.11}}

  router:
    image: redes-lab-base:1
    container_name: e2-router
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["sh","-c","ip route del default 2>/dev/null || true; exec sleep infinity"]
    networks:
      seg-a: {ipv4_address: 10.0.10.254}
      seg-b: {ipv4_address: 10.0.20.254}

networks:
  seg-a:
    driver: bridge
    ipam: {config: [{subnet: 10.0.10.0/24}]}
  seg-b:
    driver: bridge
    ipam: {config: [{subnet: 10.0.20.0/24}]}